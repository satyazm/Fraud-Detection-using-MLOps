# Structured logging configuration, loaded via logging.config.dictConfig()
# by src/common/logger.py. Emits single-line JSON records so logs are
# machine-parseable by downstream log aggregators (e.g. ELK, CloudWatch).

version: 1
disable_existing_loggers: false

formatters:
  json:
    (): pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(levelname)s %(name)s %(module)s %(funcName)s %(lineno)d %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: json
    stream: ext://sys.stdout

root:
  level: INFO
  handlers: [console]

loggers:
  fraud_detection:
    level: INFO
    handlers: [console]
    propagate: false

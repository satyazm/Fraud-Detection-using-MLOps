# The one *real* secret in this stack: a genuine Redis AUTH password,
# actually enforced by redis.yaml's --requirepass and actually
# required by every pod that talks to Redis (via
# feast-feature-store-config's ${REDIS_PASSWORD} substitution).
#
# Deliberately not doing the same for Kafka or MLflow: this project's
# Kafka runs unauthenticated (PLAINTEXT, matching docker-compose,
# local dev by design) and MLflow has no auth of its own either — both
# are documented scope simplifications (see
# docs/decisions/0009-deployment-and-operations.md), not values this
# manifest pretends are secret when they aren't. "Secrets management"
# implemented honestly means one real Secret used for a real
# credential, not several unused Secret objects holding non-secret
# strings to look complete.
#
# The value below is a local-demo-only credential committed for a
# fully self-contained `kubectl apply -f kubernetes/` — regenerate it
# for anything beyond this local kind cluster:
#   kubectl create secret generic fraud-detection-secrets \
#     --namespace fraud-detection \
#     --from-literal=redis-password="$(openssl rand -base64 24)" \
#     --dry-run=client -o yaml > kubernetes/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: fraud-detection-secrets
  namespace: fraud-detection
type: Opaque
stringData:
  redis-password: "_AprFlxLb3bxTRLXdZuFeKXMmU5aHqN1"

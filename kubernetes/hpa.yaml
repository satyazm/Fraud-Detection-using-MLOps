# Scales the api Deployment 2-10 replicas on CPU, per the milestone's
# own example numbers. Needs metrics-server running in-cluster (not
# installed by default on `kind`) — see
# docs/decisions/0009-deployment-and-operations.md for the setup step.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: fraud-detection
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

# Feast's online store (ADR-0006), now with real auth (ADR-0007's
# Docker Compose Redis has none — this is the one place Milestone 8
# deliberately diverges, since Kubernetes is where "secrets
# management" actually needs a real secret to manage).
#
# A real bug, found the hard way: this had no volume at first either
# (same story as kafka.yaml) — a pod restart under host memory
# pressure silently emptied the online store (confirmed via
# `redis-cli DBSIZE` reporting 0 after materialized features had
# already been written). `redis-data` below persists /data across
# restarts, the same path docker-compose.yml's `redis-data` volume
# already uses.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fraud-detection
  labels:
    app: redis
spec:
  replicas: 1
  strategy:
    type: Recreate # single ReadWriteOnce volume — never run two redis pods at once
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraud-detection-secrets
                  key: redis-password
          # $(REDIS_PASSWORD) here is Kubernetes' own container-level
          # env-var substitution in command/args, not a shell feature
          # — no wrapper script needed to keep the password out of the
          # image/command string itself.
          args: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a $REDIS_PASSWORD ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a $REDIS_PASSWORD ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: fraud-detection
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fraud-detection
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-PyYAML==6.0.12.20240917
          - pandas-stubs==2.2.3.241009
          # fastapi/pydantic/uvicorn/prometheus_client ship their own
          # types (unlike mlflow/feast/pyflink/redis, which are
          # ignore_missing_imports'd in pyproject.toml) — the mypy
          # hook runs in its own isolated env, so they must be listed
          # here too or it can't resolve them at all.
          - fastapi==0.140.0
          - pydantic==2.13.4
          - uvicorn==0.34.0
          - prometheus_client==0.24.1
        args: ["--config-file=pyproject.toml"]
        files: ^src/

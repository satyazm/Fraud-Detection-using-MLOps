# Tells Grafana to load every dashboard JSON file bind-mounted at
# /var/lib/grafana/dashboards (docker-compose.yml's grafana service)
# on start — no manual dashboard import needed. Milestone 7.
apiVersion: 1

providers:
  - name: fraud-detection
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-platform"
version = "0.1.0"
description = "Real-time fraud detection MLOps platform built on the PaySim dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fraud Detection Platform Team" }]
dependencies = [
    "pyyaml>=6.0",
    "python-json-logger>=2.0",
]

[project.scripts]
fraud-detection = "fraud_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraud_detection = ["py.typed"]

# --- Ruff (linting) ---------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["data", "docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E203", # whitespace before ':' (handled by black)
]

[tool.ruff.lint.per-file-ignores]
# TransactionRequest's fields intentionally match PaySim/Kafka's exact
# wire field names (see domain.schemas) rather than snake_case aliases.
"src/fraud_detection/api/schemas.py" = ["N815"]

[tool.ruff.lint.isort]
known-first-party = ["fraud_detection"]

# --- Black (formatting) ------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

# --- Pytest --------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

# --- Coverage --------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true

# --- Mypy (static typing) ---------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
explicit_package_bases = true
strict = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "pythonjsonlogger.*",
    "sklearn.*",
    "matplotlib.*",
    "pyarrow.*",
    "xgboost.*",
    "lightgbm.*",
    "mlflow.*",
    "confluent_kafka.*",
    "feast.*",
    "pyflink.*",
    "redis.*",
    "evidently.*",
]
ignore_missing_imports = true
